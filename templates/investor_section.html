  <details class="investor-research"><summary>这些变化值得跟着买吗？</summary><p>我们回看过一段时间的数据，发现跟着知名投资人的持仓变化买入，并不总能赚钱或跑赢市场。</p><p>朱少醒的部分增持股票表现不错，但研究样本不多，个别股票影响很大；阿克曼的历史模拟也有较大亏损。历史结果不能保证以后也一样，适合当作了解思路的参考。</p></details>
