name: Tenbagger source audit
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install 'akshare==1.18.94' requests
      - run: python tenbagger_research/cloud_probe.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: tenbagger-source-audit
          path: tenbagger_research/cloud_output/
          if-no-files-found: warn
          retention-days: 30
