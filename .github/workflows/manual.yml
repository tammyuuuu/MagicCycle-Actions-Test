name: Manual market test
on:
  workflow_dispatch:
  schedule:
    - cron: "30 8 * * 1-5"
concurrency:
  group: market-data-test
  cancel-in-progress: false
permissions:
  contents: read
  pages: write
  id-token: write
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      TZ: Asia/Shanghai
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install -r requirements.txt
      - run: python -m unittest -v test_market_safety test_close_validation
      - uses: actions/cache/restore@v4
        with:
          path: data_cache
          key: valuation-v1-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: valuation-v1-
      - run: python run_check.py
      - run: python build_page.py
      - uses: actions/cache/save@v4
        with:
          path: data_cache
          key: valuation-v1-${{ github.run_id }}-${{ github.run_attempt }}
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs
      - uses: actions/deploy-pages@v4
        id: deployment
      - name: Verify published data
        run: python verify_published.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: market-test-results
          path: |
            docs/index.json
            docs/data-version.json
            data_cache/etf_*.csv
          if-no-files-found: warn
