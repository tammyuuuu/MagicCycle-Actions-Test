name: Acquire annual research inputs
on:
  push:
    paths: ['.github/workflows/annual-inputs.yml', 'annual_mirror.py']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install requests duckdb
      - name: Extract content-verified quarterly inputs
        run: |
          mkdir -p annual-inputs
          curl -fLsS --retry 2 --max-time 900 'https://huggingface.co/datasets/erlenbusch/sec-edgar/resolve/main/sec_edgar.duckdb?download=true' -o sec_edgar.duckdb
          python annual_mirror.py
      - uses: actions/upload-artifact@v4
        with:
          name: annual-inputs
          path: annual-inputs/
          if-no-files-found: error

