name: Manual market test
on:
  workflow_dispatch:
  schedule:
    - cron: "30 8 * * 1-5"
concurrency:
  group: market-data-test
  cancel-in-progress: false
permissions:
  contents: read
  pages: write
  id-token: write
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      TZ: Asia/Shanghai
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install -r requirements.txt
      - name: Check trading day
        id: calendar
        run: |
          python -c "import json,datetime,os; c=json.load(open('ashare_calendar.json')); d=datetime.datetime.now(datetime.timezone(datetime.timedelta(hours=8))).date(); ds=d.isoformat(); assert c['valid_from'] <= ds <= c['valid_through'], 'Calendar expired'; closed=d.weekday() >= 5 or any(a <= ds <= b for a,b in c['closed_ranges']); open(os.environ['GITHUB_OUTPUT'],'a').write('run='+str(not closed or os.environ['GITHUB_EVENT_NAME'] != 'schedule').lower()+'\n')"
      - run: python -m unittest -v test_market_safety
        if: steps.calendar.outputs.run == 'true'
      - uses: actions/cache/restore@v4
        if: steps.calendar.outputs.run == 'true'
        with:
          path: data_cache
          key: valuation-v1-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: valuation-v1-
      - run: python run_check.py
        if: steps.calendar.outputs.run == 'true'
      - run: python build_page.py
        if: steps.calendar.outputs.run == 'true'
      - uses: actions/cache/save@v4
        if: steps.calendar.outputs.run == 'true'
        with:
          path: data_cache
          key: valuation-v1-${{ github.run_id }}-${{ github.run_attempt }}
      - uses: actions/upload-pages-artifact@v3
        if: steps.calendar.outputs.run == 'true'
        with:
          path: docs
      - uses: actions/deploy-pages@v4
        if: steps.calendar.outputs.run == 'true'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: market-test-results
          path: |
            docs/index.json
            docs/data-version.json
            data_cache/etf_*.csv
          if-no-files-found: warn
