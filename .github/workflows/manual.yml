name: Manual market test
on:
  workflow_dispatch:
concurrency:
  group: market-data-test
  cancel-in-progress: false
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      TZ: Asia/Shanghai
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install -r requirements.txt
      - uses: actions/cache/restore@v4
        with:
          path: data_cache
          key: valuation-v1-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: valuation-v1-
      - run: python run_check.py
      - uses: actions/cache/save@v4
        with:
          path: data_cache
          key: valuation-v1-${{ github.run_id }}-${{ github.run_attempt }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: market-test-results
          path: |
            docs/index.json
            docs/data-version.json
          if-no-files-found: warn
