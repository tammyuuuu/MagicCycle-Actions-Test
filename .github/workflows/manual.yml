name: Research monitoring
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths-ignore:
      - "research_monitor/runtime/**"
  schedule:
    - cron: "30 8 * * 1-5"
    - cron: "30 21 18-21 2,5,8,11 *"
concurrency:
  group: market-data-test
  cancel-in-progress: false
permissions:
  contents: read
  pages: write
  id-token: write
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      TZ: Asia/Shanghai
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install requests exchange-calendars
      - run: python -m unittest -v test_azure_monitor test_research_inventory test_annual_study
      - name: Restore published first observation
        run: python restore_observation.py
      - name: Monitor Azure first disclosure
        id: monitor
        continue-on-error: true
        run: python azure_monitor.py
      - name: Restore and evaluate registered experiments
        run: python experiment_tracker.py
      - run: python quarterly_studies.py
      - run: python annual_track.py
      - run: python build_page.py
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs
      - uses: actions/deploy-pages@v4
        id: deployment
      - name: Verify published data
        run: python verify_published.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: market-test-results
          path: |
            docs/research.json
            research_monitor/
          if-no-files-found: warn
